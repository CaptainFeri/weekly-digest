name: Weekly GitHub Digest

on:
  schedule:
    # هر چهارشنبه ساعت 18:00 UTC (21:30 به وقت تهران)
    # cron format: minute hour day-of-month month day-of-week
    # day-of-week: 0=Sunday, 1=Monday, ..., 3=Wednesday, 6=Saturday
    - cron: "0 18 * * 3"

  # اجازه اجرای دستی برای تست
  workflow_dispatch:

jobs:
  build-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # برای کامیت کردن خلاصه در مخزن

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Generate weekly digest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
          # اختیاری: برای خلاصه‌سازی با AI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/digest.py

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: weekly digest $(date +%Y-%m-%d)"
          git push
